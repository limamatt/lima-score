name: Teste ntfy
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 -c "
          import json,urllib.request
          c=json.dumps(dict(topic='limascore-teste-8k2q',title='⚽ GOL de teste!',message='Time A 1 × 0 Time B',tags=['soccer'],priority=4,click='https://limamatt.github.io/lima-score/')).encode()
          print(urllib.request.urlopen(urllib.request.Request('https://ntfy.sh/',data=c,headers={'Content-Type':'application/json'}),timeout=10).read()[:300])"
          curl -s -m 20 "https://ntfy.sh/limascore-teste-8k2q/json?poll=1"
          echo; curl -s -m 20 "https://ntfy.sh/limascore-gols/json?poll=1&since=6h"
