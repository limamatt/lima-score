name: Teste mapa
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json,urllib.request,collections
          for ev in ("401841318","401841118"):
              d=json.load(urllib.request.urlopen(f"https://site.api.espn.com/apis/site/v2/sports/soccer/bra.1/summary?event={ev}",timeout=30))
              teams={c["team"]["id"]:c["team"]["displayName"] for c in d["header"]["competitions"][0]["competitors"]}
              cnt=collections.Counter(); ex={}
              for c in d.get("commentary") or []:
                  p=c.get("play") or {}
                  if "fieldPositionX" not in p: continue
                  t=(p.get("type") or {}).get("text"); cnt[t]+=1
                  ex.setdefault(t,[]).append((teams.get(str((p.get("team") or {}).get("id"))), p.get("fieldPositionX"),p.get("fieldPositionY"),p.get("fieldPosition2X"),p.get("fieldPosition2Y"),(c.get("text") or "")[:90]))
              print("=====",ev,teams,dict(cnt))
              for t,l in ex.items():
                  for x in l[:4]: print(t,x)
          PY
