name: Teste publico
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sL -m 90 -o j.txt -w "jina %{http_code} %{size_download}\n" "https://r.jina.ai/https://conteudo.cbf.com.br/sumulas/2026/142233b.pdf" || echo falhou
          head -c 4000 j.txt; echo; grep -n -i "p[uú]blico\|pagante\|presente" j.txt | head -20
