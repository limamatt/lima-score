name: Teste publico
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sL -m 90 -o o.txt -w "ogol %{http_code} %{size_download}\n" "https://r.jina.ai/https://www.ogol.com.br/edicao/brasileirao-serie-a-2026/" || echo falhou
          curl -sL -m 90 -o w.txt -w "wf %{http_code} %{size_download}\n" "https://r.jina.ai/https://www.worldfootball.net/report/serie-a-2026-flamengo-rj-palmeiras/" || echo falhou
          curl -sL -m 90 -o f.txt -w "fbref %{http_code} %{size_download}\n" "https://r.jina.ai/https://fbref.com/en/comps/24/schedule/Serie-A-Scores-and-Fixtures" || echo falhou
          for f in o.txt w.txt f.txt; do echo "===== $f"; head -c 1500 $f; echo; grep -i -m8 "attendance\|público\|zuschauer\|assistência" $f | cut -c1-300; done
