name: Teste publico
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
          curl -sL -m 40 -A "$UA" -o b.html -w "busca %{http_code} %{size_download}\n" "https://ge.globo.com/busca/?q=p%C3%BAblicos+e+rendas+rodada+brasileir%C3%A3o&order=recent&species=not%C3%ADcias"
          curl -sL -m 40 -A "$UA" -o b2.html -w "busca2 %{http_code} %{size_download}\n" "https://ge.globo.com/busca/?q=p%C3%BAblicos+rendas+24%C2%AA+rodada+brasileir%C3%A3o"
          python3 - <<'PY'
          import re,html,urllib.parse
          for f in ["b.html","b2.html"]:
              h=open(f,encoding="utf-8",errors="ignore").read()
              print("=====",f,len(h))
              links=re.findall(r'href="([^"]+)"',h)
              out=[]
              for l in links:
                  l=html.unescape(l)
                  if "u=" in l: 
                      q=urllib.parse.parse_qs(urllib.parse.urlparse(l).query).get("u")
                      if q: l=q[0]
                  if "ge.globo.com" in l and "noticia" in l and l not in out: out.append(l)
              print("\n".join(out[:25]))
              print([re.sub(r"\s+"," ",re.sub(r"<[^>]+>"," ",x))[:120] for x in re.findall(r'<div class="widget--info__title[^"]*">(.*?)</div>',h,re.S)][:20])
          PY
