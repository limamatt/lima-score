name: Teste publico
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="LimaScore/1.0 (https://limamatt.github.io/lima-score/)"
          t() { curl -sL -m 40 -A "$UA" -o "$1" -w "$1 %{http_code} %{size_download}\n" "$2" || echo "falhou $1"; }
          t pt.txt "https://pt.wikipedia.org/w/index.php?title=Campeonato_Brasileiro_de_Futebol_de_2026_-_S%C3%A9rie_A&action=raw"
          t en.txt "https://en.wikipedia.org/w/index.php?title=2026_Campeonato_Brasileiro_S%C3%A9rie_A&action=raw"
          python3 - <<'PY'
          import re
          for f in ["pt.txt","en.txt"]:
              h=open(f,encoding="utf-8",errors="ignore").read()
              print("=====",f,len(h))
              for m in re.finditer(r"(?im)^=+\s*[^=\n]*(p[úu]blico|attendance)[^=\n]*=+", h):
                  print(h[m.start():m.start()+2500]); print("-----")
              print([h[i.start()-100:i.start()+200] for i in re.finditer(r"(?i)público|attendance", h)][:4])
          PY
