name: Teste CBF
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -4 -sIL -m 40 -o /dev/null -w "ipv4 %{http_code}\n" https://conteudo.cbf.com.br/sumulas/2026/142233b.pdf || echo "falhou ipv4 $?"
          curl -sIL -m 40 -o /dev/null -w "http %{http_code}\n" http://conteudo.cbf.com.br/sumulas/2026/142233b.pdf || echo "falhou http $?"
          curl -sIL -m 40 -o /dev/null -w "escudo %{http_code}\n" https://conteudo.cbf.com.br/clubes/20385/escudo.jpg || echo "falhou escudo $?"
          getent hosts conteudo.cbf.com.br
