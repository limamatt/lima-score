name: Teste CBF
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U="https://www.cbf.com.br/futebol-brasileiro/jogos/campeonato-brasileiro/serie-a/2026"
          curl -sL -A "Mozilla/5.0" -o j.html "$U/santos-fc-x-mirassol/832122"
          curl -sL -A "Mozilla/5.0" -o s.html "$U/x/832123"
          wc -c j.html s.html
          python3 - <<'PY'
          import re
          for f in ("j.html","s.html"):
              h=open(f,encoding="utf-8",errors="ignore").read()
              print("=====",f, re.findall(r"<title>(.*?)</title>",h))
              i=h.find("Edina")
              print(h[max(0,i-1500):i+2500] if i>=0 else "sem Edina")
              print("API:", sorted(set(re.findall(r"https?://[a-z0-9.-]*cbf[a-z0-9./_-]*", h)))[:40])
              for k in ("Árbitro","Arbitro","arbitr","escala","Rodada"):
                  j=h.find(k); print(k, j, repr(h[j-200:j+400]) if j>=0 else "")
          PY
