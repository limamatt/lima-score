name: Teste CBF
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          pip install pypdf -q
          curl -sL -A "Mozilla/5.0" -o b.pdf https://conteudo.cbf.com.br/sumulas/2026/142233b.pdf
          curl -sL -A "Mozilla/5.0" -o b81.pdf https://conteudo.cbf.com.br/sumulas/2026/14281b.pdf
          curl -sL -A "Mozilla/5.0" -o d.html "https://www.cbf.com.br/futebol-brasileiro/jogos/campeonato-brasileiro/serie-a/2026/x/832122?view=documentos"
          ls -la; file b.pdf b81.pdf
          python3 -c "
          import pypdf,re
          for f in ('b.pdf','b81.pdf'):
              try: print('=====',f); print(pypdf.PdfReader(f).pages[0].extract_text()[:3000])
              except Exception as e: print(e)
          h=open('d.html',encoding='utf-8',errors='ignore').read(); print(sorted(set(re.findall(r'https://conteudo.cbf.com.br/sumulas/[^\"\s]+', h))))
          "
