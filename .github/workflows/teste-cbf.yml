name: Teste CBF
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out; cd out
          curl -sL -A "Mozilla/5.0" -o jogo.html -w "%{http_code}\n" "https://www.cbf.com.br/futebol-brasileiro/jogos/campeonato-brasileiro/serie-a/2026/santos-fc-x-mirassol/832122"
          curl -sL -A "Mozilla/5.0" -o semslug.html -w "%{http_code}\n" "https://www.cbf.com.br/futebol-brasileiro/jogos/campeonato-brasileiro/serie-a/2026/x/832123"
          curl -sL -A "Mozilla/5.0" -o tabela.html -w "%{http_code}\n" "https://www.cbf.com.br/futebol-brasileiro/tabelas/campeonato-brasileiro/serie-a/2026"
          ls -la
      - uses: actions/upload-artifact@v4
        with: { name: cbf, path: out }
