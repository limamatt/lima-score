name: Narracao
on: workflow_dispatch
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          pip install -q edge-tts
          mkdir audio && cd audio
          cat > falas.json <<'JSON'
          [["01", "Este é o Lima Score: previsões, números e notícias do Brasileirão, num site que se atualiza sozinho. Vem ver como usar."], ["02", "Na aba Início, o Panorama mostra a chance de cada time ser campeão, ir para a Liberta, a Pré-Liberta, a Sula ou cair. É só tocar nas abas para trocar."], ["03", "Logo abaixo, os Cenários contam o que cada clube precisa: a chance se vencer, empatar ou perder, e para quem torcer na rodada."], ["04", "Em Tabela, você vê a classificação geral, por turno, como mandante e como visitante, além das chances de cada posição."], ["05", "Em Rodadas ficam todos os jogos. Durante a partida, o placar atualiza ao vivo, e dá para abrir a transmissão com um toque."], ["06", "Abra um jogo para ver a escalação no campinho, os gols em vídeo, o árbitro e as estatísticas completas da partida."], ["07", "Em Jogadores estão os artilheiros, os garçons e o scout de cada atleta, com mapa de chutes e comparação por posição."], ["08", "A aba Arbitragem mostra quantos jogos cada árbitro apitou, os cartões e as chamadas do VAR, inclusive por clube."], ["09", "Em Notícias, as últimas do seu time. E tocando no escudo de qualquer clube, você abre a página dele com todos os números."], ["10", "Lima Score. Salve nos favoritos e acompanhe o Brasileirão com a gente!"]]
          JSON
          python3 - <<'PY'
          import json,subprocess
          for k,t in json.load(open("falas.json")):
              for voz in ("pt-BR-AntonioNeural","pt-BR-FranciscaNeural"):
                  subprocess.run(["edge-tts","--voice",voz,"--rate=+6%","--text",t,"--write-media",f"{k}_{voz[6:9]}.mp3"],check=True)
          PY
          ls -la
          git init -q && git checkout -q -b midia && git add . && git -c user.name=robo -c user.email=robo@x commit -qm audio
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" midia
