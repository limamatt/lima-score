name: Atualizar dados

on:
  schedule:
    - cron: "*/15 * * * *"   # a cada 15 minutos
  workflow_dispatch:          # botão "Run workflow" para rodar na hora

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install numpy

      - name: Baixar jogos e recalcular previsões
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python scripts/update.py

      - name: Buscar notícias do ge
        continue-on-error: true
        run: python scripts/noticias.py

      - name: Publicar se algo mudou
        run: |
          git add -N data/noticias.json 2>/dev/null || true
          if git diff --quiet -- data/site.json data/noticias.json; then
            echo "Sem mudanças."
            exit 0
          fi
          git config user.name "robo-termometro"
          git config user.email "robo-termometro@users.noreply.github.com"
          git add data/site.json data/noticias.json 2>/dev/null || git add data/site.json
          git commit -m "Atualiza dados $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
